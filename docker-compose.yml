services:
  db:
    image: mariadb:11
    container_name: techova-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Debe definir DB_NAME en .env}
      MARIADB_USER: ${DB_USER:?Debe definir DB_USER en .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Debe definir DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Debe definir DB_ROOT_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - techova-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: techova-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:?Debe definir DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Debe definir DB_PASSWORD en .env}
      DB_NAME: ${DB_NAME:?Debe definir DB_NAME en .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techova-net

  dizzle-app:
    image: nginx:alpine
    container_name: techova-dizzle
    restart: unless-stopped
    volumes:
      - ./proxy/dizzle:/usr/share/nginx/html:ro
    networks:
      - techova-net

  kuma-app:
    image: nginx:alpine
    container_name: techova-kuma
    restart: unless-stopped
    volumes:
      - ./proxy/kuma:/usr/share/nginx/html:ro
    networks:
      - techova-net

  proxy:
    image: nginx:alpine
    container_name: techova-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - dizzle-app
      - kuma-app
    networks:
      - techova-net

volumes:
  db-data:

networks:
  techova-net:
    driver: bridge