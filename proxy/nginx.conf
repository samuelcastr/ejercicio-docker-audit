# Proxy inverso Techova
# Redirige 80 -> 443 y sirve 3 subdominios con TLS (certificados autofirmados).
# Los nombres api/duzzle/kuma.techovaf4.duckdns.org resuelven por DNS público (DuckDNS wildcard).
# TLS con certificado autofirmado generado en el deploy.

# HTTP -> HTTPS
server {
    listen 80;
    server_name api.techovaf4.duckdns.org duzzle.techovaf4.duckdns.org kuma.techovaf4.duckdns.org;

    location / {
        return 302 https://$host$request_uri;
    }
}

# --- API (techova-app) ---
server {
    listen 443 ssl;
    server_name api.techovaf4.duckdns.org;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://techova-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Servicio duzzle ---
server {
    listen 443 ssl;
    server_name duzzle.techovaf4.duckdns.org;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://techova-duzzle:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Servicio kuma ---
server {
    listen 443 ssl;
    server_name kuma.techovaf4.duckdns.org;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://techova-kuma:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}