name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 1-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pytest
        run: pytest -v

  bandit:
    name: 2-bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bandit
        run: pip install bandit
      - name: Escaneo de seguridad
        run: bandit app.py -f txt

  trivy:
    name: 3-trivy
    needs: [test, bandit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ejercicio-docker-audit:latest
      - name: Escaneo Trivy (HIGH/CRITICAL bloquea)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.73.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ejercicio-docker-audit:latest

  deploy:
    name: 4-deploy
    needs: [test, bandit, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Aprovisionar Docker en la EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gnupg ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable --now docker
            fi
            sudo docker version --format 'Docker server: {{.Server.Version}}'
            docker compose version
      - name: Copiar codigo a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,db/,app.py,Dockerfile,requirements.txt,.env.example,proxy/"
          target: /tmp/techova
      - name: Desplegar con docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/techova
            sudo cp -r /tmp/techova/. /opt/techova/
            cd /opt/techova
            if [ ! -f .env ]; then
              printf 'DB_NAME=techova\nDB_USER=techova\nDB_PASSWORD=techova_dev_2026\nDB_ROOT_PASSWORD=root_dev_2026\nSECRET_KEY=dev-clave-ci\n' | sudo tee .env >/dev/null
            fi
            if [ ! -f proxy/certs/server.crt ]; then
              echo "Generando certificado autofirmado para *.techovaf4.duckdns.org"
              sudo mkdir -p proxy/certs
              sudo openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
                -keyout proxy/certs/server.key -out proxy/certs/server.crt \
                -subj "/CN=api.techovaf4.duckdns.org" \
                -addext "subjectAltName=DNS:api.techovaf4.duckdns.org,DNS:duzzle.techovaf4.duckdns.org,DNS:kuma.techovaf4.duckdns.org"
            fi
            sudo docker compose pull --ignore-pull-failures
            sudo docker compose up -d --build
            sudo docker compose up -d --force-recreate proxy
            sleep 12
            echo "== Verificacion HTTPS =="
            curl -kfsS https://localhost/health -H "Host: api.techovaf4.duckdns.org" | grep -q '"status":"ok"' && echo "API por HTTPS OK"
            code=$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/ --resolve duzzle.techovaf4.duckdns.org:443:127.0.0.1)
            [ "$code" = "200" ] || [ "$code" = "302" ] && echo "duzzle (Dozzle) por HTTPS OK ($code)"
            code=$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/ --resolve kuma.techovaf4.duckdns.org:443:127.0.0.1)
            [ "$code" = "200" ] || [ "$code" = "302" ] && echo "kuma (Uptime Kuma) por HTTPS OK ($code -> setup)"
            curl -fsS -o /dev/null http://localhost/ -H "Host: api.techovaf4.duckdns.org" -w "HTTP 80 -> %{http_code} (302)\n" || true